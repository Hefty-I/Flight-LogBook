<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7486"/>
    </marker>
    <style>
      .zone-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #1F2A44; }
      .zone-note { font-size: 12px; fill: #4A5468; }
      .box { fill: #FFFFFF; stroke: #1F2A44; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1F2A44; }
      .sub { font-size: 12.5px; fill: #4A5468; }
      .flow { stroke: #1F2A44; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .read { stroke: #6B7486; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowGrey); }
      .num { fill: #1F5FD1; }
      .num-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .legend { font-size: 13.5px; fill: #1F2A44; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1040" fill="#FFFFFF"/>
  <text x="750" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2A44">FlightProof — system architecture, data flow and trust boundaries</text>

  <!-- ZONE: users -->
  <rect x="20" y="70" width="270" height="560" rx="12" fill="#F5F6F8" stroke="#9AA3B5" stroke-dasharray="8 6"/>
  <text x="38" y="98" class="zone-title">USERS</text>
  <text x="38" y="116" class="zone-note">untrusted: every action is checked on-chain</text>

  <rect x="40" y="135" width="230" height="64" rx="8" class="box"/>
  <text x="55" y="162" class="title">Student pilot</text>
  <text x="55" y="183" class="sub">MetaMask wallet</text>
  <rect x="40" y="215" width="230" height="64" rx="8" class="box"/>
  <text x="55" y="242" class="title">Instructor</text>
  <text x="55" y="263" class="sub">MetaMask wallet</text>
  <rect x="40" y="295" width="230" height="64" rx="8" class="box"/>
  <text x="55" y="322" class="title">Flight school</text>
  <text x="55" y="343" class="sub">MetaMask wallet</text>
  <rect x="40" y="375" width="230" height="64" rx="8" class="box"/>
  <text x="55" y="402" class="title">Aviation authority</text>
  <text x="55" y="423" class="sub">one per country · MetaMask</text>
  <rect x="40" y="530" width="230" height="74" rx="8" class="box" stroke-dasharray="5 4"/>
  <text x="55" y="557" class="title">Public verifier</text>
  <text x="55" y="578" class="sub">airline, foreign regulator</text>
  <text x="55" y="595" class="sub">no wallet needed</text>

  <!-- ZONE: website -->
  <rect x="320" y="70" width="290" height="560" rx="12" fill="#F5F6F8" stroke="#9AA3B5" stroke-dasharray="8 6"/>
  <text x="338" y="98" class="zone-title">WEBSITE</text>
  <text x="338" y="116" class="zone-note">React + ethers.js v6, runs in the browser</text>
  <rect x="340" y="135" width="250" height="469" rx="8" class="box"/>
  <text x="355" y="163" class="title">FlightProof DApp</text>
  <text x="355" y="195" class="sub">• My logbook (student)</text>
  <text x="355" y="218" class="sub">• Sign flights (instructor, batch)</text>
  <text x="355" y="241" class="sub">• My school (students, aircraft)</text>
  <text x="355" y="264" class="sub">• Authority console (disputes,</text>
  <text x="367" y="282" class="sub">licences, validations, rules)</text>
  <text x="355" y="305" class="sub">• Verify a pilot (public, read-only)</text>
  <text x="355" y="338" class="sub">• Role-based tabs read from contracts</text>
  <text x="355" y="361" class="sub">• Transaction panel: pending →</text>
  <text x="367" y="379" class="sub">confirmed (gas) / failed (reason)</text>
  <text x="355" y="412" class="sub">• Evidence check:</text>
  <text x="367" y="430" class="sub">keccak256(file) = on-chain hash?</text>

  <!-- users -> website -->
  <line x1="270" y1="167" x2="338" y2="167" class="flow"/>
  <line x1="270" y1="247" x2="338" y2="247" class="flow"/>
  <line x1="270" y1="327" x2="338" y2="327" class="flow"/>
  <line x1="270" y1="407" x2="338" y2="407" class="flow"/>
  <line x1="270" y1="567" x2="338" y2="567" class="read"/>

  <!-- ZONE: ethereum -->
  <rect x="650" y="70" width="410" height="720" rx="12" fill="#EAF1FD" stroke="#1F5FD1" stroke-width="1.5"/>
  <text x="668" y="98" class="zone-title" fill="#1F5FD1">ON-CHAIN · ETHEREUM</text>
  <text x="668" y="116" class="zone-note">Hardhat local network (Sepolia-ready) · rules enforced in code</text>

  <rect x="675" y="135" width="360" height="92" rx="8" class="box"/>
  <text x="690" y="162" class="title">AuthorityRegistry</text>
  <text x="690" y="184" class="sub">countries, licence rules (≥ ICAO 40 h),</text>
  <text x="690" y="203" class="sub">consortium votes, emergency pause</text>
  <rect x="675" y="245" width="360" height="92" rx="8" class="box"/>
  <text x="690" y="272" class="title">TrainingRegistry</text>
  <text x="690" y="294" class="sub">schools, instructors, students,</text>
  <text x="690" y="313" class="sub">aircraft (ICAO24, ADS-B yes/no)</text>
  <rect x="675" y="355" width="360" height="110" rx="8" class="box" stroke-width="2.5"/>
  <text x="690" y="382" class="title">FlightLog</text>
  <text x="690" y="404" class="sub">flights, co-signatures, oracle results,</text>
  <text x="690" y="423" class="sub">disputes, 10-minute time-slot bitmap,</text>
  <text x="690" y="442" class="sub">running hour totals</text>
  <rect x="675" y="483" width="360" height="92" rx="8" class="box"/>
  <text x="690" y="510" class="title">LicenceManager</text>
  <text x="690" y="532" class="sub">licences, review after instructor</text>
  <text x="690" y="551" class="sub">revocation, cross-border validation</text>

  <rect x="675" y="595" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#1F5FD1" stroke-dasharray="5 4"/>
  <text x="690" y="620" class="title" font-size="14">Stored on-chain</text>
  <text x="690" y="641" class="sub">wallet addresses, flight claims (UTC times,</text>
  <text x="690" y="659" class="sub">ICAO airports), statuses, totals, evidence</text>
  <text x="690" y="677" class="sub">hashes. No names, IDs or medical data.</text>

  <!-- website <-> ethereum -->
  <line x1="590" y1="200" x2="673" y2="200" class="flow"/>
  <circle cx="610" cy="182" r="11" class="num"/><text x="610" y="187" text-anchor="middle" class="num-text">1</text>
  <circle cx="636" cy="182" r="11" class="num"/><text x="636" y="187" text-anchor="middle" class="num-text">2</text>
  <circle cx="623" cy="222" r="11" class="num"/><text x="623" y="227" text-anchor="middle" class="num-text">7</text>
  <line x1="673" y1="330" x2="592" y2="330" class="read"/>

  <!-- ZONE: oracle -->
  <rect x="1100" y="70" width="380" height="330" rx="12" fill="#FDF3E7" stroke="#D9822B" stroke-width="1.5"/>
  <text x="1118" y="98" class="zone-title" fill="#B5651D">OFF-CHAIN · ORACLE (Node.js)</text>
  <text x="1118" y="116" class="zone-note">semi-trusted: only ORACLE_ROLE, result + evidence hash</text>
  <rect x="1120" y="135" width="210" height="62" rx="8" class="box"/>
  <text x="1135" y="161" class="title" font-size="14.5">Event watcher</text>
  <text x="1135" y="182" class="sub">FlightSigned, saved cursor</text>
  <rect x="1120" y="222" width="210" height="62" rx="8" class="box"/>
  <text x="1135" y="248" class="title" font-size="14.5">Matcher</text>
  <text x="1135" y="269" class="sub">times ±30 min, airports</text>
  <rect x="1120" y="309" width="210" height="62" rx="8" class="box"/>
  <text x="1135" y="335" class="title" font-size="14.5">Evidence builder</text>
  <text x="1135" y="356" class="sub">JSON → keccak256 hash</text>
  <line x1="1225" y1="197" x2="1225" y2="220" class="flow"/>
  <line x1="1225" y1="284" x2="1225" y2="307" class="flow"/>

  <!-- ZONE: external -->
  <rect x="1100" y="440" width="380" height="350" rx="12" fill="#F1F2F4" stroke="#8A93A6" stroke-width="1.5"/>
  <text x="1118" y="468" class="zone-title" fill="#4A5468">EXTERNAL DATA</text>
  <text x="1118" y="486" class="zone-note">public / untrusted: verified by hash or cross-check</text>
  <rect x="1120" y="505" width="260" height="78" rx="8" class="box"/>
  <text x="1135" y="532" class="title" font-size="14.5">OpenSky Network API</text>
  <text x="1135" y="553" class="sub">real ADS-B flight tracks</text>
  <text x="1135" y="571" class="sub">(OAuth2; or a recorded replay)</text>
  <rect x="1120" y="640" width="260" height="78" rx="8" class="box"/>
  <text x="1135" y="667" class="title" font-size="14.5">IPFS (Pinata)</text>
  <text x="1135" y="688" class="sub">evidence files</text>
  <text x="1135" y="706" class="sub">(or the oracle's local copy)</text>

  <!-- 3: FlightLog -> event watcher -->
  <path d="M1035 395 H1070 V166 H1118" class="read"/>
  <circle cx="1070" cy="280" r="11" class="num"/><text x="1070" y="285" text-anchor="middle" class="num-text">3</text>
  <!-- 4: matcher -> OpenSky -->
  <path d="M1330 253 H1415 V544 H1382" class="flow"/>
  <circle cx="1415" cy="400" r="11" class="num"/><text x="1415" y="405" text-anchor="middle" class="num-text">4</text>
  <!-- 5: evidence -> IPFS -->
  <path d="M1330 340 H1455 V679 H1382" class="flow"/>
  <circle cx="1455" cy="600" r="11" class="num"/><text x="1455" y="605" text-anchor="middle" class="num-text">5</text>
  <!-- 6: evidence -> FlightLog -->
  <path d="M1120 352 H1088 V445 H1037" class="flow"/>
  <circle cx="1088" cy="398" r="11" class="num"/><text x="1088" y="403" text-anchor="middle" class="num-text">6</text>
  <!-- 8: website evidence check -> IPFS -->
  <path d="M465 604 V752 H1100 V700 H1118" class="read"/>
  <circle cx="860" cy="752" r="11" class="num"/><text x="860" y="757" text-anchor="middle" class="num-text">8</text>

  <!-- Legend -->
  <rect x="20" y="810" width="1460" height="215" rx="12" fill="#FAFBFC" stroke="#D5DAE3"/>
  <text x="40" y="840" class="zone-title">FLOW</text>
  <g class="legend">
    <circle cx="48" cy="866" r="10" class="num"/><text x="48" y="871" text-anchor="middle" class="num-text">1</text>
    <text x="66" y="871">Student logs a flight (aircraft, UTC times, ICAO airports): a transaction.</text>
    <circle cx="48" cy="896" r="10" class="num"/><text x="48" y="901" text-anchor="middle" class="num-text">2</text>
    <text x="66" y="901">Instructor co-signs it (one or many in one transaction).</text>
    <circle cx="48" cy="926" r="10" class="num"/><text x="48" y="931" text-anchor="middle" class="num-text">3</text>
    <text x="66" y="931">FlightLog emits FlightSigned; the oracle picks it up.</text>
    <circle cx="48" cy="956" r="10" class="num"/><text x="48" y="961" text-anchor="middle" class="num-text">4</text>
    <text x="66" y="961">Oracle asks OpenSky which flights that aircraft really made.</text>
    <circle cx="760" cy="866" r="10" class="num"/><text x="760" y="871" text-anchor="middle" class="num-text">5</text>
    <text x="778" y="871">Oracle stores the evidence file (claim, OpenSky answer, decision).</text>
    <circle cx="760" cy="896" r="10" class="num"/><text x="760" y="901" text-anchor="middle" class="num-text">6</text>
    <text x="778" y="901">Oracle submits MATCH / NO_DATA / MISMATCH + the evidence hash.</text>
    <circle cx="760" cy="926" r="10" class="num"/><text x="760" y="931" text-anchor="middle" class="num-text">7</text>
    <text x="778" y="931">Authority issues the licence; foreign authorities validate it (rules on-chain).</text>
    <circle cx="760" cy="956" r="10" class="num"/><text x="760" y="961" text-anchor="middle" class="num-text">8</text>
    <text x="778" y="961">Anyone re-hashes the evidence file and compares it with the on-chain hash.</text>
  </g>
  <line x1="40" y1="998" x2="90" y2="998" class="flow"/>
  <text x="100" y="1003" class="legend">transaction (signed in MetaMask) / data sent</text>
  <line x1="400" y1="998" x2="450" y2="998" class="read"/>
  <text x="460" y="1003" class="legend">read only (view calls, events, downloads)</text>
  <rect x="800" y="989" width="34" height="18" rx="4" fill="#EAF1FD" stroke="#1F5FD1"/>
  <text x="842" y="1003" class="legend">on-chain</text>
  <rect x="920" y="989" width="34" height="18" rx="4" fill="#FDF3E7" stroke="#D9822B"/>
  <text x="962" y="1003" class="legend">off-chain service</text>
  <rect x="1095" y="989" width="34" height="18" rx="4" fill="#F1F2F4" stroke="#8A93A6"/>
  <text x="1137" y="1003" class="legend">external data</text>
  <rect x="1250" y="989" width="34" height="18" rx="4" fill="#F5F6F8" stroke="#9AA3B5" stroke-dasharray="5 4"/>
  <text x="1292" y="1003" class="legend">trust boundary</text>
</svg>
